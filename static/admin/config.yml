backend:
  name: github
  repo: shahar-baharal/philly-green-clean
  branch: main
  base_url: https://sveltia-cms-auth.shahar-baharal.workers.dev

site_url: https://phillygreenclean.com

app_title: "Philly Green Clean - Content"

# Uploads go into the repo (no R2 bucket: the site is on Netlify).
media_folder: assets/media/uploads
public_folder: media/uploads

collections:
  - name: "landing_page"
    label: "Home page"
    files:
      - label: "Hero"
        name: "hero"
        file: "data/blocks/hero.yaml"
        fields:
          - label: "Content"
            name: "content"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - label: "Primary button"
                name: "primary_action"
                widget: "object"
                fields:
                  - { label: "Text", name: "text", widget: "string" }
                  - { label: "Link", name: "url", widget: "string" }
                  - { label: "Style", name: "style", widget: "string" }
              - label: "Secondary button"
                name: "secondary_action"
                widget: "object"
                fields:
                  - { label: "Text", name: "text", widget: "string" }
                  - { label: "Link", name: "url", widget: "string" }
              - label: "Image"
                name: "media"
                widget: "object"
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Description (alt text)", name: "alt", widget: "string" }

      - label: "Services"
        name: "services"
        file: "data/blocks/services.yaml"
        fields:
          - label: "Content"
            name: "content"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Services"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Text", name: "text", widget: "text" }

      - label: "FAQ"
        name: "faq"
        file: "data/blocks/faq.yaml"
        fields:
          - label: "Content"
            name: "content"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Questions"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }

      - label: "Contact & hours"
        name: "contact"
        file: "data/blocks/contact.yaml"
        fields:
          - label: "Content"
            name: "content"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Service area title", name: "visit_title", widget: "string" }
              - { label: "Contact title", name: "connect_title", widget: "string" }
              - label: "Service area"
                name: "address"
                widget: "object"
                fields:
                  - { label: "Lines", name: "lines", widget: "list" }
              - { label: "Hours", name: "office_hours", widget: "list" }

  - name: "settings"
    label: "Site settings"
    files:
      - label: "Contact details"
        name: "contact_details"
        file: "data/contact.yaml"
        fields:
          - { label: "Phone", name: "phone", widget: "string", required: false, hint: "e.g. (267) 317-7709. Also update the hero button and the header's Call now link." }
          - { label: "Email", name: "email", widget: "string", required: false }
